name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (тег образа) для отката'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Get lowercase repo name
        id: vars
        run: |
          echo "image_name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Rollback to previous version
        run: |
          IMAGE=${{ steps.vars.outputs.image_name }}:${{ github.event.inputs.version }}
          docker stop app-blue 2>/dev/null || true
          docker run -d --name app-blue -p 8080:8080 $IMAGE
          sleep 5
          curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health || exit 1
          echo "Rollback to ${{ github.event.inputs.version }} completed" >> rollback.log

      - name: Save rollback logs
        run: docker logs app-blue > rollback_logs.txt

      - name: Upload rollback logs
        uses: actions/upload-artifact@v4
        with:
          name: rollback-logs
          path: rollback_logs.txt
